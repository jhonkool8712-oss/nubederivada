    <title>La Derivada</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>¿Qué es la derivada?</h1>
    <p>La derivada mide el cambio de una función respecto a una variable.</p>

    <h2>Ejemplo:</h2>
    <p>f(x) = x²</p>
    <p>f'(x) = 2x</p>
</body>
